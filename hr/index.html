.ph-s.past{opacity:.5}
.ph-s.now .ph-d{background:var(--slate)}.ph-s.now .ph-d b,.ph-s.now .ph-d small{color:#fff}
.ph-s .ph-d{width:44px;height:44px;border-radius:12px;background:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ph-s .grow b{display:block;font-size:14px;font-weight:600;color:var(--ink)}.ph-s .grow small{font-size:12px;color:var(--haze)}
.ph-card .card-h{margin-bottom:4px}
.ph-tagline{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--mint)}
.ph-tagline.shut{color:var(--ember-ink)}

/* Staffing: gaya NARA (blok slate bercorak) */
.st-hero{position:relative;overflow:hidden;border-radius:var(--r-xl,24px);padding:18px 18px 16px;color:#fff;background:linear-gradient(150deg,#262B66 0%,var(--slate) 48%,#2A1C6B 100%);margin-bottom:12px}
.st-hero::before{content:"";position:absolute;inset:0;background-image:var(--corak);background-size:84px 219px;background-position:right -18px top -64px;opacity:.62;-webkit-mask-image:radial-gradient(120% 85% at 100% 0%,#000 0%,rgba(0,0,0,.55) 45%,transparent 78%);mask-image:radial-gradient(120% 85% at 100% 0%,#000 0%,rgba(0,0,0,.55) 45%,transparent 78%);pointer-events:none}
.st-hero>*{position:relative}
.st-hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.st-eyebrow{font:600 11px/1 Montserrat,Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#C9C3F5}
.st-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 12px;font-family:inherit;font-weight:600;font-size:12px;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}
.st-btn svg{width:14px;height:14px}
.st-big{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 12px;margin:14px 0 14px}
.st-big>b{font:700 40px/0.95 Montserrat,Inter,sans-serif;letter-spacing:-.02em}
.st-big>span{font-size:12.5px;line-height:1.3;color:rgba(255,255,255,.78)}.st-big small{color:rgba(255,255,255,.55)}
.st-pill{font-style:normal;margin-left:auto;font-size:12px;font-weight:600;border-radius:999px;padding:6px 11px;background:rgba(51,214,198,.18);color:#7FF0E3}
.st-pill.orange{background:rgba(245,183,107,.2);color:#FFD49A}
.st-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.st-stats b{display:block;font:700 18px/1.1 Montserrat,Inter,sans-serif}
.st-stats span{font-size:11.5px;color:rgba(255,255,255,.65)}
.st-src{margin-top:12px;font-size:11.5px;color:rgba(255,255,255,.55)}
.st-sug{gap:10px}
.st-sug-h{display:flex;align-items:center;gap:10px}.st-sug-h b{font-size:15px}
.st-sug-ico{width:32px;height:32px;border-radius:10px;background:var(--ember-soft);color:var(--ember-ink);display:grid;place-items:center;flex:0 0 auto}
.st-sug-ico svg{width:18px;height:18px}
.st-mv{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.35;color:var(--ink);font-weight:500}
.st-mv i{font-style:normal;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto;background:var(--mist-2);color:var(--slate)}
.st-mv.add i{background:var(--error-soft);color:var(--error)}.st-mv.cut i{background:#FFF4E5;color:#9A4B00}.st-mv.ok i{background:var(--mint-soft);color:var(--mint)}
.st-mv small{display:block;font-size:11.5px;font-weight:400;color:var(--haze);margin-top:1px}
.st-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.st-slot{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:12px 8px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.st-slot::before{content:"";position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--mint-2)}
.st-slot.orange::before{background:#F5B76B}.st-slot.red::before{background:var(--error)}
.st-slot>*{position:relative}
.st-sl{font:700 13px/1.1 Montserrat,Inter,sans-serif;color:var(--ink)}
.st-slot>small{font-size:11px;color:var(--haze)}
.st-rw{position:relative;width:72px;height:72px;margin:6px 0 4px}
.st-ring{width:72px;height:72px;transform:rotate(-90deg)}
.st-ring .trk{fill:none;stroke:var(--mist-2);stroke-width:7}
.st-ring .val{fill:none;stroke:var(--mint-2);stroke-width:7;stroke-linecap:round}
.st-ring.orange .val{stroke:#F5B76B}.st-ring.red .val{stroke:var(--error)}
.st-rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.st-rv b{font:700 20px/1 Montserrat,Inter,sans-serif;color:var(--ink)}.st-rv small{font-size:10.5px;color:var(--haze);margin-top:2px}
.st-tag{font-style:normal;font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--mint-soft);color:var(--mint);white-space:nowrap}
.st-tag.orange{background:#FFF4E5;color:#9A4B00}.st-tag.red{background:var(--error-soft);color:var(--error)}
.st-kpi{margin-top:6px;font-size:10.5px;color:var(--ink-2)}
.st-nx{font-size:10px;color:var(--haze)}
.st-h3{margin:0;font-size:15px}
.st-lg{font-size:11.5px}
.st-bl{display:flex;flex-direction:column}
.st-b{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 0;border-top:1px solid var(--line);font-family:inherit;text-align:left;cursor:pointer;width:100%}
.st-b:first-child{border-top:0}
.st-b.on b{color:var(--ember-ink)}
.st-b b{display:block;font-size:14px;font-weight:600;color:var(--ink)}.st-b small{font-size:11.5px;color:var(--haze)}
.st-b-v{text-align:right;line-height:1.1}.st-b-v b{font:700 15px/1 Montserrat,Inter,sans-serif}

/* Sesi pintar */
.auth-card .auth-shared{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;margin:2px 0 0;font-size:12.5px;font-weight:500;color:var(--haze);cursor:pointer}

.sess-note{display:flex;gap:10px;align-items:flex-start;margin-top:4px;padding:12px;border-radius:14px;background:var(--paper);font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.sess-note svg{width:18px;height:18px;flex:0 0 auto;color:var(--ember);margin-top:1px}
.sess-note b{color:var(--ink);font-weight:600}

/* HR actions: ringkas & tajam */
.hra{gap:10px}
.hra-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hra-s{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid transparent;background:var(--paper);border-radius:14px;padding:9px 10px;font-family:inherit;text-align:left;cursor:pointer;color:var(--ink);transition:border-color .15s,background-color .15s}
.hra-s b{font:700 20px/1 Montserrat,Inter,sans-serif}
.hra-s span{font-size:11px;line-height:1.2;color:var(--haze);font-weight:500}
.hra-s.con b{color:var(--error)}.hra-s.pro b{color:var(--ember-ink)}.hra-s.soon b{color:#9A4B00}

.hra-s[disabled]{opacity:.45;cursor:default}.hra-s[disabled] b{color:var(--haze)}
.hra-list{display:flex;flex-direction:column}
.hra-r{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 0;border-top:1px solid var(--line);font-family:inherit;text-align:left;cursor:pointer;color:var(--ink)}
.hra-r:first-child{border-top:0}
.hra-r .grow{min-width:0}
.hra-r b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hra-r small{display:block;font-size:11.5px;color:var(--haze);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hra-dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;font-style:normal}
.hra-dot svg{width:16px;height:16px}
.hra-dot.con{background:var(--error-soft);color:var(--error)}.hra-dot.pro{background:var(--ember-soft);color:var(--ember-ink)}.hra-dot.stale{background:var(--mist-2);color:var(--haze)}
.hra-w{font-style:normal;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:0 0 auto}
.hra-w.red{color:var(--error)}.hra-w.orange{color:#9A4B00}
.hra-more{align-self:center;border:0;background:none;color:var(--ember-ink);font-family:inherit;font-weight:600;font-size:13px;line-height:1;padding:6px 10px;cursor:pointer}
.hra-ok{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2)}
.hra-ok svg{width:22px;height:22px;color:var(--mint);flex:0 0 auto}
.hra-m{display:flex;flex-direction:column;gap:10px}
.hra-ml{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;border-bottom:1px solid var(--line);padding-bottom:9px}
.hra-ml span{color:var(--haze)}.hra-ml b{font-weight:600;text-align:right}
.hra-ml .hra-w{margin-left:6px}
.hra-step{display:flex;gap:10px;align-items:flex-start;background:var(--mist);border-radius:14px;padding:12px;font-size:13.5px;line-height:1.45;color:var(--ink)}
.hra-step svg{width:18px;height:18px;flex:0 0 auto;color:var(--ember);margin-top:2px}
.hra-step small{display:block;color:var(--haze);font-size:11.5px;margin-top:4px}

/* Coverage: simulasi lantai (gaya NARA slate) + barisan syif */
.cv-hero{position:relative;overflow:hidden;border-radius:var(--r-xl,24px);padding:16px 14px 14px;color:#fff;background:linear-gradient(150deg,#262B66 0%,var(--slate) 48%,#2A1C6B 100%);display:flex;flex-direction:column;gap:10px}
.cv-hero::before{content:"";position:absolute;left:0;right:0;top:0;height:150px;background-image:var(--corak);background-size:84px 219px;background-position:right -18px top -64px;opacity:.45;-webkit-mask-image:radial-gradient(70% 90% at 100% 0%,#000 0%,transparent 75%);mask-image:radial-gradient(70% 90% at 100% 0%,#000 0%,transparent 75%);pointer-events:none}
.cv-hero>*{position:relative}
.cv-eb{display:block;font:600 10.5px/1 Montserrat,Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#C9C3F5}
.cv-pill{font-style:normal;font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.12);color:#fff}
.cv-pill.green{background:rgba(51,214,198,.2);color:#7FF0E3}.cv-pill.orange{background:rgba(245,183,107,.22);color:#FFD49A}.cv-pill.red{background:rgba(255,107,107,.22);color:#FFB3B3}
.cv-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:#fff;color:var(--slate);border-radius:999px;padding:9px 14px;font-family:inherit;font-weight:600;font-size:13px;line-height:1;cursor:pointer}
.cv-btn svg{width:15px;height:15px}
.cv2{padding:14px 14px 12px;gap:12px;border-radius:22px}

.cv-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cv-tm{display:flex;align-items:center;gap:8px;margin-top:5px}

.cv-lv{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#7FF0E3;background:rgba(51,214,198,.14);border-radius:8px;padding:3px 7px}
.cv-lv[hidden],.cv-rg[hidden]{display:none}
.cv-rg{font-size:12px;color:rgba(255,255,255,.62);font-weight:500}
.cv-lv i{width:6px;height:6px;border-radius:50%;background:#33D6C6;box-shadow:0 0 0 3px rgba(51,214,198,.25)}
.cv-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cv-sub{font-size:11.5px;color:rgba(255,255,255,.72);white-space:nowrap}
.cv-pill{border-radius:8px!important}
.cv-barsw{padding:2px 2px 0}
.cv-bars{position:relative;display:flex;align-items:flex-end;gap:4px;height:46px;cursor:ew-resize;touch-action:pan-y;-webkit-user-select:none;user-select:none;outline:none}
.cv-bars:focus-visible{box-shadow:0 0 0 2px rgba(205,187,255,.6);border-radius:6px}

.cv-bars.drag .cv-ph{transition:none}.cv-bars.drag .cv-ph b{transform:scale(1.25)}
.cv-play{display:inline-flex;align-items:center;gap:6px;border:0;background:#fff;color:var(--slate);border-radius:10px;padding:6px 11px 6px 9px;font:600 11.5px/1 Inter,sans-serif;cursor:pointer}
.cv-play svg{width:13px;height:13px}
.cv-play.on{background:#33D6C6;color:#0B2A2E}
.cv-wrap{display:flex;flex-direction:column;gap:14px}

.md{flex:1;min-height:0;display:flex;flex-direction:column}
.md-log{flex:1;min-height:0;overflow-y:auto;padding:6px 14px 18px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.md-hero{display:flex;align-items:center;gap:10px;padding:2px 2px 6px}
.md-hero b{display:block;font:700 14px/1.2 Montserrat,Inter,sans-serif;color:var(--slate)}
.md-hero small{display:block;font-size:12px;line-height:1.35;color:var(--haze);margin-top:2px}
.md-row{display:flex;gap:8px;align-items:flex-end;max-width:94%}
.md-av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#9EF0E6;background:linear-gradient(150deg,#7A3EFF,#1B1F4B);box-shadow:0 4px 10px rgba(122,62,255,.26)}
.md-av svg{width:16px;height:16px}
.md-av.lg{width:40px;height:40px}
.md-av.lg svg{width:20px;height:20px}
.md-b{min-width:0;border-radius:18px;padding:11px 14px;font-size:14.5px;line-height:1.5;color:var(--ink);animation:mdIn .26s cubic-bezier(.2,.8,.2,1)}
.md-b p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.md-b.nara{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 2px 8px rgba(27,31,75,.05)}
.md-b.me{align-self:flex-end;max-width:84%;color:#fff;background:linear-gradient(150deg,#7A3EFF,#5B2ED1);border-bottom-right-radius:6px;box-shadow:0 4px 12px rgba(91,46,209,.22)}
.md-tag{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font:600 10.5px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-ink)}
.md-tag.warn{color:var(--ember-ink)}
.md-tag svg{width:12px;height:12px}
.md-kats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.md-kat{display:flex;align-items:center;gap:8px;min-height:0;border:1px solid var(--line);background:var(--mist);border-radius:14px;padding:9px 10px;font:600 13px/1.25 Inter,sans-serif;color:var(--slate);cursor:pointer;text-align:left}
.md-kat i{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#fff;color:var(--ember);font-style:normal}
.md-kat i svg{width:16px;height:16px}
.md-kat:active,.md-opt:active{background:var(--ember-soft);border-color:#CDBBFF}
.md-rel{margin-top:12px;font:600 10.5px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--haze)}
.md-opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.md-rel+.md-opts{margin-top:8px}
.md-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:0;border:1px solid var(--line);background:var(--mist);border-radius:12px;padding:10px 12px;font:500 13.5px/1.35 Inter,sans-serif;color:var(--slate);text-align:left;cursor:pointer}
.md-opt svg{width:14px;height:14px;flex:0 0 auto;color:var(--ember)}
.md-typing{display:flex;gap:4px;padding:15px 16px}
.md-typing i{width:7px;height:7px;border-radius:50%;background:var(--slate-3);animation:mdDot 1s infinite}
.md-typing i:nth-child(2){animation-delay:.15s}
.md-typing i:nth-child(3){animation-delay:.3s}
@keyframes mdDot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@keyframes mdIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.md-dock{flex:0 0 auto;border-top:1px solid var(--line);background:#fff;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.md-sug{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px 10px;padding:0 12px}
.md-sug:empty{display:none}
.md-sug button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:0;max-width:250px;border:1px solid #DED3FF;background:var(--ember-soft);color:var(--ember-ink);font:600 12.5px/1.2 Inter,sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-sug button.md-top{background:var(--slate);border-color:var(--slate);color:#fff}
.md-sug button svg{width:14px;height:14px;flex:0 0 auto}
.md-ask{display:flex;flex-direction:row;gap:8px;align-items:center}
.md-ask input{flex:1;min-height:46px;border-radius:999px;padding:10px 16px;background:var(--mist)}
.md-ask input:focus{background:#fff}
.md-ask button{flex:0 0 auto;width:46px;height:46px;min-height:0;padding:0;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,#7A3EFF,#5B2ED1);cursor:pointer;box-shadow:0 4px 12px rgba(91,46,209,.3)}
.md-ask button svg{width:20px;height:20px}
.md-ask button:disabled{opacity:.7}
.md-note{display:block;text-align:center;font-size:11.5px;line-height:1.35;color:var(--haze);margin-top:8px}

/* ---------- Compensation & Benefits (NARA HR 1.0.19) ---------- */
.modal.cb-sheet{padding-top:calc(12px + env(safe-area-inset-top))}
.modal.cb-sheet .modal-card{max-width:520px;max-height:calc(100vh - 28px);max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding:18px 16px 0}
.cb{display:flex;flex-direction:column;gap:16px}
.cb-hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px 18px;color:#fff;background:radial-gradient(110% 80% at 100% 0%,rgba(0,200,181,.26),transparent 55%),radial-gradient(90% 70% at 0% 100%,rgba(122,62,255,.5),transparent 62%),linear-gradient(160deg,#262B66,#1B1F4B 58%,#14173B)}
.cb-hero::before{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 22px rgba(255,255,255,.025),0 0 0 46px rgba(255,255,255,.02);pointer-events:none}
.cb-hero-ic{position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.cb-hero-ic svg{width:24px;height:24px;color:#CDBBFF}
.cb-eye{position:relative;font:600 10.5px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9EF0E6}
.cb-hero h3{position:relative;font:700 22px/1.2 Montserrat,Inter,sans-serif;margin:10px 60px 4px 0;letter-spacing:-.02em;color:#fff}
.cb-hero p{position:relative;margin:0;color:rgba(255,255,255,.74);font-size:13.5px}
.cb-nums{position:relative;display:flex;gap:8px;margin-top:16px}
.cb-nums div{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 10px 9px}
.cb-nums b{display:block;font:700 24px/1 Montserrat,Inter,sans-serif;font-variant-numeric:tabular-nums}
.cb-nums span{display:block;margin-top:5px;font-size:11.5px;color:rgba(255,255,255,.72);line-height:1.25}
.cb-path{position:relative;list-style:none;margin:18px 0 0;padding:0;display:flex;overflow-x:auto;scrollbar-width:none}
.cb-path::-webkit-scrollbar{display:none}
.cb-path li{position:relative;flex:0 0 auto;min-width:88px;padding:16px 12px 0 0}
.cb-path li::before{content:"";position:absolute;top:5px;left:12px;right:0;height:2px;background:rgba(255,255,255,.18)}
.cb-path li:last-child::before{display:none}
.cb-path li i{position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:#1B1F4B;border:2px solid rgba(255,255,255,.45)}
.cb-path li.on i{background:#00C8B5;border-color:#00C8B5;box-shadow:0 0 0 4px rgba(0,200,181,.22)}
.cb-path b{display:block;font-size:12.5px;font-weight:600}
.cb-path small{display:block;font-size:11px;color:rgba(255,255,255,.62);margin-top:2px;white-space:nowrap}
.cb-sec h4{font:700 15.5px/1.2 Montserrat,Inter,sans-serif;margin:4px 2px 10px;color:var(--slate);letter-spacing:-.01em}
.cb-lead{margin:-4px 2px 10px;font-size:13px;color:var(--haze)}
.cb-grp+.cb-grp{margin-top:6px}
.cb-gl{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--haze);margin:12px 2px 8px}
.cb-gl i{width:8px;height:8px;border-radius:3px;background:var(--g)}
.cb-gl em{font-style:normal;color:var(--slate-3);letter-spacing:0}
.cb-it{border-radius:16px;background:var(--paper);border:1px solid var(--line);margin-bottom:8px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.cb-it[open]{border-color:color-mix(in srgb,var(--g) 30%,var(--line));box-shadow:0 8px 20px -14px rgba(27,31,75,.35)}
.cb-it summary{list-style:none;display:flex;align-items:center;gap:12px;padding:11px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cb-it summary::-webkit-details-marker{display:none}
.cb-ic{flex:0 0 auto;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#F4F2FB;background:color-mix(in srgb,var(--g) 11%,#fff);color:var(--g)}
.cb-ic svg{width:21px;height:21px}
.cb-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cb-tx b{font-size:14.5px;color:var(--ink);line-height:1.3}
.cb-v{font-size:13px;color:var(--ink-2)}
.cb-nx{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--teal-ink);margin-top:2px}
.cb-nx svg{width:12px;height:12px}
.cb-chev{flex:0 0 auto;color:var(--slate-3);transition:transform .2s;display:grid;font-style:normal}
.cb-chev svg{width:16px;height:16px}
.cb-it[open] .cb-chev{transform:rotate(90deg)}
.cb-more{padding:0 14px 14px 64px;font-size:13.5px;color:var(--ink-2)}
.cb-more p{margin:0 0 8px}
.cb-cond{display:flex;gap:6px;align-items:flex-start;color:var(--ink)}
.cb-cond svg{width:15px;height:15px;color:var(--mint);flex:0 0 auto;margin-top:2px}
.cb-tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.cb-tags>span{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:8px;background:var(--mist);color:var(--ink-2)}
.cb-tags svg{width:12px;height:12px}
.cb-tags>.cb-pf{background:var(--ember-soft);color:var(--ember-ink)}
.cb-tags>.cb-law{background:var(--mint-soft);color:var(--teal-ink)}
.cb-ref{display:block;font-size:11px;color:var(--slate-3)}
.cb-it.lock{background:var(--cloud);border-style:dashed}
.cb-it.lock .cb-ic{background:#fff;color:var(--slate-3)}
.cb-ms+.cb-ms{margin-top:12px}
.cb-ms-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 2px 8px}
.cb-ms-h b{font-size:13.5px;color:var(--slate)}
.cb-ms-h span{font-size:12px;color:var(--haze);font-weight:500}
.cb-rv{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--mint-soft);color:var(--teal-ink);padding:9px 12px;border-radius:12px;margin:0 0 10px}
.cb-rv svg{width:16px;height:16px;flex:0 0 auto}
.cb-lagi{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--ember-soft);color:var(--ember-ink);font-size:13.5px}
.cb-lagi svg{width:20px;height:20px;flex:0 0 auto}
.cb-src{font-size:11.5px;color:var(--haze);margin:0 2px;line-height:1.5}
.cb-cta{position:sticky;bottom:0;margin:0 -16px;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,255,255,0),#fff 28%)}
.cb-cta .btn{gap:8px}
.cb-cta .btn svg{width:18px;height:18px}
.cb-top{display:flex;flex-direction:column;gap:14px}
.card.cb-ban{display:flex;flex-direction:row;align-items:center;text-align:left;gap:12px;padding:14px;background:linear-gradient(135deg,#F1ECFF,#E6FBF8)}
.cb-ban .btn{flex:0 0 auto}
.cb-ban-ic{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(155deg,#2A2E66,#1B1F4B);color:#CDBBFF}
.cb-ban-ic svg{width:22px;height:22px}
.cb-ban b,.cb-card-b b{display:block;font-size:15px;color:var(--ink)}
.cb-ban small,.cb-card-b small{display:block;font-size:12.5px;color:var(--haze);margin-top:2px}
.card.cb-card{padding:0}
.cb-card-b{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:16px;text-align:left;cursor:pointer;border-radius:inherit;color:inherit}
.cb-admin{display:flex;flex-direction:column;gap:14px}
.cb-lawbar{display:flex;align-items:center;gap:12px;width:100%;border:1px solid #B3EEE8;background:var(--mint-soft);border-radius:18px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--ink)}
.cb-lawbar-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--teal-ink);flex:0 0 auto}
.cb-lawbar-ic svg{width:20px;height:20px}
.cb-lawbar b{display:block;font-size:14px}.cb-lawbar small{display:block;font-size:12.5px;color:var(--ink-2)}
.cb-pre{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cb-prev h3{font-size:16px}.cb-prev>p{margin:2px 0 12px;font-size:13px}
.cb-pre button{min-height:54px;border:1px solid var(--line);background:var(--paper);border-radius:14px;cursor:pointer;padding:8px 6px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--slate)}
.cb-pre button b{font-size:13px;font-weight:600}.cb-pre button small{font-size:11.5px;color:var(--haze)}
.cb-pre button:active{background:var(--mist)}
.cb-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:2;background:var(--paper);padding:6px 0}
.cb-bar .seg.mini{flex:1 1 auto;min-width:0;overflow-x:auto}
.cb-add{flex:0 0 auto;width:42px;height:42px;border-radius:14px;border:0;background:var(--ember);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px -10px rgba(122,62,255,.9)}
.cb-add svg{width:20px;height:20px}
.cb-gh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.cb-gh h3{flex:1;font-size:16px}
.cb-r{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cb-r .ph-tg{margin-top:2px}
.cb-r.on .ph-tg{background:var(--ember)}.cb-r.on .ph-tg i{transform:translateX(18px)}
.cb-rb{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.cb-rb b{font-size:14.5px}
.cb-rval{font-size:13px;color:var(--ink-2)}
.cb-r:not(.on) .cb-rb b,.cb-r:not(.on) .cb-rval{color:var(--haze)}
.cb-rb .cb-tags{margin:4px 0 0}
.cb-c{font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:7px;background:var(--mist);color:var(--ink-2)}
.cb-c.pf{background:var(--ember-soft);color:var(--ember-ink)}
.cb-s{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:7px;border:1px solid var(--line);color:var(--slate-3)}
.cb-s.sug{border-color:#F3D19C;background:#FFF7E8;color:#9A5B00}
.cb-s.hr{border-color:#B3EEE8;background:var(--mint-soft);color:var(--teal-ink)}
.cb-flag{display:flex;gap:6px;align-items:flex-start;font-size:12px;line-height:1.4;color:var(--teal-ink);margin:4px 0 0}
.cb-flag svg{width:14px;height:14px;flex:0 0 auto;margin-top:1px}
.cb-form{display:flex;flex-direction:column;gap:12px}
label.cb-live{flex-direction:row;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--mist);cursor:pointer}
.cb-live b{display:block;font-size:14px;color:var(--ink)}.cb-live small{display:block;font-weight:400;color:var(--haze)}
.cb-live input{width:22px;height:22px}
.cb-fs{border:0;padding:0;margin:0;min-width:0}
.cb-fs legend{font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px;padding:0}
.cb-cks{display:flex;flex-wrap:wrap;gap:8px}
label.cb-ck{flex-direction:row;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;color:var(--ink);cursor:pointer}
label.cb-ck:has(input:checked){border-color:var(--ember);background:var(--ember-soft);color:var(--ember-ink)}
.cb-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (min-width:1000px){.cb-pre{grid-template-columns:repeat(6,minmax(0,1fr))}}

/* =====================================================================
   NARA Compact 2.0: Today, Schedule, Requests (maklum balas Abu 13/11/2026: tulisan & kotak terlalu besar,
   terlalu banyak skrol). Skala tipografi lebih halus, ruang lebih rapat, maklumat sama. HR & Me tidak berubah.
   Medan input kekal 16px supaya iPhone tidak zum.
   ===================================================================== */
.dense .top{padding:calc(10px + env(safe-area-inset-top)) 16px 0;gap:10px}
.dense .top-row{min-height:40px}
.dense .icon-round{width:38px;height:38px}
.dense .icon-round svg{width:18px;height:18px}
.dense .icon-round .dot{top:7px;right:8px}
.dense .hello{gap:0}
.dense .hello .sub{font-size:13px;line-height:1.3}
.dense .hello h1{font-size:26px;line-height:1.12;letter-spacing:-.03em}
.dense .top.compact .hello h1{font-size:24px}
.dense .who{gap:0;margin-top:4px}
.dense .who span{background:none;padding:0;border-radius:0;font-size:12.5px;color:var(--haze)}
.dense .who span+span::before{content:"·";margin:0 7px;color:var(--slate-3)}
.dense .main{padding:10px 16px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom));gap:10px}
.dense .narrow,.dense .today-grid{gap:10px}
.dense .card{padding:14px 16px;gap:10px;border-radius:20px}
.dense .card-h h3{font-size:15.5px;letter-spacing:-.01em}
.dense .card-h h3 small{font-size:13px;font-weight:500;color:var(--haze);letter-spacing:0;margin-left:8px}
.dense .eyebrow{font-size:12px}
.dense .link{font-size:13px;padding:2px 0}
.dense .empty{font-size:13px;padding:10px 0}
.dense .chip{font-size:11.5px;padding:5px 9px}
.dense .btn{min-height:46px;font-size:14.5px}
.dense .btn.small{min-height:36px;padding:0 14px;font-size:13px}
.dense .seg button{min-height:36px;padding:0 16px;font-size:13.5px}
/* Kad syif hari ini */
.dense .hero.shift{padding:14px 16px;gap:10px;border-radius:24px}
.dense .shift-day{font-size:12.5px}
.dense .live{font-size:11.5px;padding:4px 10px 4px 8px}
.dense .shift-body{min-height:0;gap:8px}
.dense .shift-main{gap:2px}
.dense .shift-time{font-size:38px}
.dense .shift-time.word{font-size:28px}
.dense .shift-end{font-size:15px}
.dense .shift-then{font-size:13px}
.dense .shift-sub{font-size:12px;margin-top:4px;line-height:1.4}
.dense .dial-wrap{width:118px;height:118px;margin:0 -2px 0 0}
.dense .dial-ring{width:108px;height:108px}
.dense .dial{width:88px;height:88px;gap:2px}
.dense .dial b{font-size:13.5px}
.dense .dial small{font-size:9px;max-width:68px}
.dense .dial .dial-ico{width:18px;height:18px}
.dense .dial.full{box-shadow:0 0 0 5px var(--slate),0 0 0 9px rgba(122,62,255,.38),0 12px 26px rgba(0,0,0,.28)}
.dense .times{gap:6px}
.dense .times div{border-radius:12px;padding:7px 10px}
.dense .times span{font-size:11px}
.dense .times b{font-size:14px}
.dense .times.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.dense .times.n4 div{flex-direction:column;align-items:flex-start;gap:1px;padding:6px 9px}
.dense .geo-note{font-size:11.5px}
.dense .hero.shift.calm{padding-bottom:16px}
/* Pintasan */
.dense .quick{gap:6px}
.dense .quick button{gap:5px;font-size:11.5px}
.dense .quick span{width:46px;height:46px;border-radius:16px}
.dense .quick svg{width:20px;height:20px}
/* Minggu ini */
.dense .wk{gap:2px}
.dense .wk-d{padding:5px 0 6px;gap:3px;border-radius:14px}
.dense .wk-d span{font-size:11px}
.dense .wk-d b{width:30px;height:30px;font-size:14px}
.dense .wk-d i{width:14px;height:3px}
.dense .wk-detail{padding:9px 12px;gap:10px;border-radius:14px}
.dense .wk-detail .tl-bar{min-height:30px}
.dense .wk-detail .grow b{font-size:14px}
.dense .wk-detail .grow span{font-size:12px}
/* Jubin statistik & faedah */
.dense .tiles{gap:10px}
.dense .tile{padding:12px 14px;gap:2px;border-radius:20px}
.dense .tile b{font-size:24px}
.dense .tile b small{font-size:12.5px}
.dense .tile .muted,.dense .tile .hint{font-size:11.5px}
.dense .tile .eyebrow{font-size:12px}
.dense .tile .ring{top:11px;right:11px;width:30px;height:30px}
.dense .rw-ico{top:11px;right:11px;width:30px;height:30px;border-radius:10px}
.dense .rw-ico svg{width:16px;height:16px}
.dense .card.cb-ban{padding:10px 12px;gap:10px;border-radius:18px}
.dense .cb-ban-ic{width:36px;height:36px;border-radius:12px}
.dense .cb-ban-ic svg{width:18px;height:18px}
.dense .cb-ban b{font-size:14px}
.dense .cb-ban small{font-size:12px}
/* Notis, rakan sekerja, tugasan */
.dense .note-row{gap:10px;padding:9px 0}
.dense .note-row .tick{width:18px;height:18px}
.dense .note-row .grow b{font-size:13.5px}
.dense .note-row .grow p{font-size:12px;margin:1px 0 6px}
.dense .li{padding:9px 0;font-size:14px}
.dense .tm .card-h{margin-bottom:2px}
.dense .tm-g{padding:9px 0 0}
.dense .tm-gh{font-size:12px;margin-bottom:8px}
.dense .tm-ps{grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px 4px}
.dense .tm-av .av{width:34px;height:34px;font-size:12.5px}
.dense .tm-n{font-size:11.5px}
/* Schedule */
.dense .wk-nav .icon-round{width:36px;height:36px}
.dense .wk-nav div b{font-size:15px}
.dense .wk-nav div span{font-size:12px}
.sch-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--slate);color:#fff;border-radius:20px;padding:11px 4px;position:relative;overflow:hidden}
.sch-sum::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 140% at 100% 0%,rgba(122,62,255,.45),transparent 60%);pointer-events:none}
.sch-sum > div{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;border-left:1px solid rgba(255,255,255,.12)}
.sch-sum > div:first-child{border-left:0}
.sch-sum b{font:600 19px/1.15 Montserrat,Inter,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sch-sum b small{font-size:12px;font-weight:500;color:rgba(255,255,255,.6);margin-left:1px}
.sch-sum span{font-size:11px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 6px}
.dense .tl-card{padding:2px 0}
.dense .today-day{padding:9px 14px;gap:12px}
.dense .tl-date{width:34px}
.dense .tl-date span{font-size:10.5px}
.dense .tl-date b{font-size:17px}
.dense .today-day.now .tl-date b{width:28px;height:28px;font-size:14px;margin-top:1px}
.dense .today-day .tl-bar{min-height:30px}
.dense .today-day .grow b{font-size:14px;white-space:normal;line-height:1.3}
.dense .today-day .grow span{font-size:11.5px}
.dense .today-day .chip{padding:4px 8px}
/* Requests */
.dense form{gap:11px}
.dense label,.dense .fld-l{font-size:12.5px;gap:5px}
.dense input,.dense select,.dense textarea{min-height:44px;padding:10px 12px;border-radius:14px}
.dense select{padding-right:36px}
.dense textarea{min-height:64px}
.dense .fld{gap:5px}
.dense .rng{min-height:54px;padding:8px 14px;border-radius:14px}
.dense .rng-s b{font-size:16px}
.dense .rng-s small{font-size:10px}
.dense .rng-arr{width:28px;height:28px}
.dense .rng-meta{font-size:12.5px}
.dense .rng-n{font-size:12px;padding:4px 10px}
.dense .hint{font-size:12px}
.dense .cb-ban .grow{min-width:0}
.dense .cb-ban small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Kawalan segmen gaya iOS: Leave | Claims dan Duration */
.t-mohon .narrow > .seg{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--mist);border-radius:999px;padding:3px;overflow:visible}
.t-mohon .narrow > .seg button{min-height:34px;background:none;color:var(--ink-2);font-weight:600}
.t-mohon .narrow > .seg button[aria-pressed="true"]{background:#fff;color:var(--slate);box-shadow:0 1px 3px rgba(27,31,75,.12),0 0 0 .5px rgba(27,31,75,.04)}
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;background:#fff;border-radius:14px;padding:3px}
.seg2 button{min-height:36px;border:0;background:none;border-radius:11px;font:600 13.5px/1 inherit;font-family:inherit;color:var(--haze);cursor:pointer;-webkit-tap-highlight-color:transparent}
.seg2 button[aria-pressed="true"]{background:var(--slate);color:#fff}
/* HR / Team: Dashboard paparan utama, modul tersusun (baris pantas + kumpulan) */
.hub2{gap:10px}
.hub-quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--mist);border-radius:20px;padding:12px 6px 10px}
.hub-i{position:relative;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;cursor:pointer;color:var(--ink);min-width:0;-webkit-tap-highlight-color:transparent;animation:tileIn .35s calc(var(--i, 0) * 30ms) both}
.hub-i .emblem{width:46px;height:46px;border-radius:15px;background:#fff;box-shadow:0 1px 2px rgba(27,31,75,.06);transition:transform .12s}
.hub-g .hub-i .emblem{background:var(--c3);box-shadow:none}
.hub-i .emblem svg{width:21px;height:21px}
.hub-i b{font-size:11.5px;font-weight:500;line-height:1.2;text-align:center;color:var(--ink-2);max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hub-i:active .emblem{transform:scale(.92)}
.hub-badge{position:absolute;top:-6px;right:-7px;min-width:19px;height:19px;border-radius:10px;padding:0 5px;background:var(--ember);color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--mist)}
.hub-h{font-size:15.5px;font-weight:600;margin:6px 2px 0;letter-spacing:-.01em;color:var(--ink)}
.hub-all{display:flex;flex-direction:column;gap:10px;scroll-margin-top:12px}
.hub-gl{font-size:11.5px;font-weight:600;color:var(--haze);text-transform:uppercase;letter-spacing:.07em}
.hub-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 4px}
@media (min-width:700px){.hub-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.hub-quick{max-width:560px}}
.dense .gauge{max-width:230px}
.dense .gauge-num b{font-size:30px}
.dense .gauge-num span{font-size:12px}
.dense .legend{font-size:12.5px;gap:6px 14px}
.dense .dash-grid,.dense .cols{gap:10px}
/* Cawangan hari ini */
.dash-grid + .cols{margin-top:12px}
.br-list{display:flex;flex-direction:column}
.br-row{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid rgba(27,31,75,.07)}
.br-row:first-child{border-top:0;padding-top:2px}
.br-dot{width:10px;height:10px;border-radius:50%;background:var(--ember)}
.br-row.ok .br-dot{background:var(--teal)}.br-row.none .br-dot{background:#E3DEF3}
.br-main{min-width:0;display:flex;flex-direction:column;gap:1px}
.br-main > b{font:600 14.5px/1.25 Montserrat,Inter,sans-serif;color:var(--slate);letter-spacing:-.01em}
.br-msg{font-size:12px;color:var(--haze);display:flex;flex-wrap:wrap;gap:0 6px}
.br-row.ok .br-msg{color:var(--teal-ink)}
.br-x::before{content:"·";margin-right:6px;color:var(--haze)}
.br-x.late{color:var(--ember-ink)}.br-x.bad{color:var(--error)}
.br-n{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--haze);font-variant-numeric:tabular-nums;white-space:nowrap}
.br-n b{font:700 17px/1 Montserrat,Inter,sans-serif;color:var(--slate)}
.br-bar{width:64px;height:5px;border-radius:5px;background:#E3DEF3;overflow:hidden}
.br-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ember),#2D9CFF)}
.br-row.ok .br-bar i{background:var(--teal)}
.br-none{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:#fff;color:var(--haze)}
.br-tot{font-size:12.5px;color:var(--haze);font-variant-numeric:tabular-nums}.br-tot b{font:700 15px Montserrat,Inter,sans-serif;color:var(--slate)}
.br-foot{margin-top:10px;padding:9px 12px;border-radius:12px;background:#fff;font-size:12px;color:var(--ink-2)}
.br-foot.warn{background:#FFF7E6;color:#9A4B00}
/* Dashboard: clock-in padat */
.dense .gauge-card{display:grid;grid-template-columns:140px minmax(0,1fr);grid-template-areas:"h h" "g l";column-gap:16px;row-gap:8px;align-items:center}
.dense .gauge-card .card-h{grid-area:h}.dense .gauge-card .gauge-wrap{grid-area:g}.dense .gauge-card .legend{grid-area:l;grid-template-columns:1fr;gap:7px}
.dense .gauge-card > .chip{grid-column:1/-1}
.dense .gauge-card .gauge{max-width:140px}
.dense .gauge-card .gauge-num{bottom:0}
.dense .gauge-card .gauge-num b{font-size:24px}
.dense .gauge-card .gauge-num span{font-size:10.5px}
/* Me: padan dengan tab lain */
.dense .card.person{gap:12px}
.dense .card.person::before,.dense .card.person::after{height:52px}
.dense .card.person .person-top{padding-top:20px;gap:12px}
.dense .card.person .person-top>div{margin-top:36px}
.dense .av.av-xl{width:56px;height:56px;font-size:19px}
.dense .person-top b{font-size:17px}
.dense .person-top span{font-size:12.5px}
.dense .facts div{padding:9px 12px}
.dense .facts dt{font-size:11px}
.dense .facts dd{font-size:13.5px}
.dense .card .muted{font-size:13px;line-height:1.45}
.dense .sess-note{font-size:12px}
.dense .btn-grid .btn{min-height:38px}
.dense .facts{grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--mist)}
.dense .facts div{background:var(--paper);border:0 !important}
.dense .facts div[style]{grid-column:span 2 !important}
.me-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.me-acts .btn{gap:8px;padding:0 10px}
.me-acts .btn svg{width:17px;height:17px;flex:0 0 auto}
@media (min-width:900px){.dense .main{padding-left:24px;padding-right:24px}}
</style>

  /** Face ID automatik: skrin log masuk pada peranti yang sudah aktifkan Face ID → terus imbas muka, tanpa tekan.

  function pkAuto() {
    if (S.token || S.pkBusy || S.noAutoPk || S.pkAutoTried || !pkOk() || !pkOnHere()) return;

    var btn = document.querySelector('[data-form=loginEmail] .pk-btn');

  function pkSignIn(btn) {
    if (S.pkBusy) return;
    var o = pkTake();
    if (!o) {
      busy(btn, true, 'Preparing…');
      call('pkLoginOptions').then(function (x) {
        S.pkWait = false; pkSetLogin(x); busy(btn, false);
        if (!x) throw new Error(pkTitle() + ' isn’t available right now. Use your password.');
        toast('Tap again to continue with ' + pkTitle() + '.');
      }).catch(function (e) { busy(btn, false); fail(e); });
      return;
    }
    S.pkWait = false; S.pkBusy = true;
    extFlow(60000); // lembaran Face ID sistem: jangan anggap app ditinggalkan
    var req, mine = LS.get('nara_pk_id');
    // Passkey peranti ini sahaja: lembaran Apple terus ke akaun ini (tiada "More Options" / pilihan peranti lain)
    var allow = mine ? [{ type: 'public-key', id: u2b(mine), transports: ['internal'] }] : [];
    try { req = navigator.credentials.get({ publicKey: { challenge: u2b(o.challenge), rpId: o.rpId, timeout: o.timeout || 60000, userVerification: 'required', allowCredentials: allow } }); }
    catch (e) { req = Promise.reject(e); }

    req.then(function (c) {
      pkExtEnd();
      if (!c) throw new Error('Cancelled');
      S.pkUsed = c.id;
      var r = c.response;

    }).then(function (r) { S.pkBusy = false; LS.set('nara_pk_on', '1'); if (S.pkUsed) LS.set('nara_pk_id', S.pkUsed); signedIn(r); })
      .catch(function (e) {
        S.pkBusy = false; pkExtEnd();
        if (allow.length && e && e.name === 'NotAllowedError') LS.del('nara_pk_id'); // passkey peranti mungkin dipadam: cuba cara umum lain kali
        var quiet = e && (e.name === 'NotAllowedError' || e.name === 'AbortError' || e.name === 'SecurityError' || e.message === 'Cancelled');
        renderEmailLogin(quiet ? '' : e.message);

      });

  function pkPrefetchReg() {
    if (!pkOk() || pkFresh(S.pkReg)) return;

        .catch(function (e) { busy(btn, false); fail(e); });

    S.pkReg = null;
    extFlow(60000);
    var req = navigator.credentials.create({ publicKey: {
      challenge: u2b(R.challenge), rp: R.rp, user: { id: u2b(R.user.id), name: R.user.name, displayName: R.user.displayName },
      pubKeyCredParams: R.pubKeyCredParams, timeout: R.timeout, attestation: 'none', authenticatorSelection: R.authenticatorSelection,
      excludeCredentials: (R.excludeCredentials || []).map(function (c) { return { type: 'public-key', id: u2b(c.id) }; })
    } });
    busy(btn, true, 'Setting up…');
    req.then(function (c) {
      pkExtEnd();
      S.pkNew = c.id;
      var r = c.response;

  /* Aliran akaun 3 langkah: 1 E-mel → 2 Kod OTP → 3 Kata laluan. mode: signup | forgot */
  var FLOW = {

    forgot: { t1: 'Reset password', s1: 'Enter your account email. We’ll send you a code to reset your password.', t3: 'New password', b3: 'Save & sign in' }

  function flowSteps(step) {

      var n = i + 1;
      return '<div class="step' + (n < step ? ' done' : n === step ? ' on' : '') + '"><i>' + (n < step ? '✓' : n) + '</i><span>' + l + '</span></div>';
    }).join('<b class="step-bar' + '"></b>') + '</div>';
  }
  function renderFlow(mode, step, email, msg) {

    } else if (step === 2) {
      var boxes = '';
      for (var i = 0; i < 6; i++) boxes += '<input class="otp-box" data-i="' + i + '" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Digit ' + (i + 1) + '"' + (i === 0 ? ' autocomplete="one-time-code"' : ' autocomplete="off"') + '>';
      body = '<form class="auth-card" data-form="verifyCode" data-mode="' + mode + '">' + flowSteps(2) + '<h1>Check your email</h1><p class="muted">Enter the 6-digit code we sent to<br><b>' + h(email) + '</b></p>' +
        '<input type="hidden" name="email" value="' + h(email) + '"><input type="hidden" name="code">' +
        '<div class="otp">' + boxes + '</div>' +
        (msg ? '<div class="err">' + h(msg) + '</div>' : '') +
        '<button class="btn block" type="submit">Verify</button>' +
        '<div class="auth-links" style="justify-content:center"><span class="muted">Didn’t get it? Check spam or</span><button type="button" class="link" data-act="otpResend" data-mode="' + mode + '" data-email="' + h(email) + '" disabled>Resend code</button></div>' +
        '<div class="auth-links" style="justify-content:center"><button type="button" class="link" data-act="authFlow" data-v="' + mode + '" data-email="' + h(email) + '">Change email</button></div></form>';
    } else {
      body = '<form class="auth-card" data-form="setPassword" data-mode="' + mode + '">' + flowSteps(3) + '<h1>' + F.t3 + '</h1><p class="muted">Email verified <span class="ok-dot">✓</span> ' + h(email) + '</p>' +
        '<input type="hidden" name="email" value="' + h(email) + '">' +
        '<label>Password<span class="pw-wrap"><input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Create a password"><button type="button" class="pw-eye" data-act="pwEye" aria-label="Show password">Show</button></span></label>' +
        '<ul class="pw-rules"><li data-r="len">At least 8 characters</li><li data-r="let">Contains a letter</li><li data-r="num">Contains a number</li></ul>' +
        '<label>Confirm password<input name="password2" type="password" autocomplete="new-password" minlength="8" required placeholder="Re-enter password"></label>' +

      pw.addEventListener('input', function () {

        Object.keys(t).forEach(function (k) { document.querySelector('[data-r=' + k + ']').classList.toggle('met', t[k]); });

  /* Kotak OTP: auto-lompat, Backspace, tampal 6 digit, auto-hantar bila lengkap; kira detik 60 s untuk hantar semula */
  function otpWire(mode, email) {
    var bx = [].slice.call(document.querySelectorAll('.otp-box')), form = document.querySelector('[data-form=verifyCode]');
    var sync = function () {
      var v = bx.map(function (b) { return b.value; }).join('');
      form.querySelector('[name=code]').value = v;
      if (/^\d{6}$/.test(v) && !form.dataset.busy) { form.dataset.busy = '1'; form.requestSubmit ? form.requestSubmit() : form.querySelector('[type=submit]').click(); }
    };
    var fill = function (from, digits) {
      digits.split('').forEach(function (d, j) { if (bx[from + j]) bx[from + j].value = d; });
      var nx = bx[Math.min(from + digits.length, 5)]; if (nx) nx.focus();
      sync();
    };
    bx.forEach(function (b, i) {
      b.addEventListener('input', function () {
        var d = b.value.replace(/\D/g, '');
        if (d.length > 1) { fill(i, d.slice(0, 6 - i)); return; }
        b.value = d;
        if (d && bx[i + 1]) bx[i + 1].focus();
        sync();
      });
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !b.value && bx[i - 1]) { bx[i - 1].focus(); bx[i - 1].value = ''; e.preventDefault(); }
      });
      b.addEventListener('paste', function (e) {
        var t = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\D/g, '');
        if (t) { e.preventDefault(); fill(0, t.slice(0, 6)); }
      });
      b.addEventListener('focus', function () { b.select(); });
    });
    bx[0].focus();
    var rs = document.querySelector('[data-act=otpResend]'), left = 60;
    var tick = function () {
      if (!document.body.contains(rs)) { clearInterval(S.otpTimer); return; }
      left--;
      rs.disabled = left > 0;
      rs.textContent = left > 0 ? 'Resend in ' + left + 's' : 'Resend code';
      if (left <= 0) clearInterval(S.otpTimer);
    };
    tick(); S.otpTimer = setInterval(tick, 1000);
  }

  function signedIn(r) {
    S.token = r.token; S.me = r.me; S.tab = 'hari';
    S.pkAutoTried = false; S.noAutoPk = false; S.pkWait = false;
    if (pkOk() && pkOnHere()) setTimeout(pkRefresh, 4000); // cabaran seterusnya sedia: log masuk semula terus dengan Face ID
    LS.set('nara_token', r.token); LS.set('nara_me', JSON.stringify(r.me));
    // Skrin Hari Ini dihantar bersama jawapan log masuk: dipaparkan terus tanpa panggilan kedua
    if (r.today) { S.data.today = r.today; cacheSet('today', r.today); S.todayAt = Date.now(); }
    // Data tab Schedule / Requests / Me / Team turut dihantar: tukar tab terus dipaparkan, tiada skeleton
    // Payslip sentiasa dilindungi PIN pada sesi baharu: tab Me dipaparkan terus (butang Unlock), disahkan di latar
    if (!window.NARA_PIN_LOGIN) swrPut({ a: 'myPayslips', mem: true }, 'LOCKED');
    if (r.boot) Object.keys(r.boot).forEach(function (k) {
      var spec = { a: k, p: k === 'myWeek' ? { minggu: ymd(monday(today())) } : undefined, mem: k === 'dashboard' };
      swrPut(spec, r.boot[k]);
      FRESH[swrKey(spec.a, spec.p)] = { t: Date.now() + 24000, p: Promise.resolve(r.boot[k]) }; // segar 30 s: tiada panggilan semula
    });
    if (r.me.email) LS.set('nara_email', r.me.email);
    ssSet('nara_alive', '1'); LS.del('nara_left'); markSeen();
    renderShell();
  }

  /* ===== Sesi pintar =====
     Telefon sendiri (lalai): kekal log masuk, minimize, tukar app, kunci telefon atau tutup app TIDAK log keluar.
     Log masuk semula hanya bila: tidak buka app 30 hari · had mutlak (90 hari; HR/Admin 30 hari, pelayan) ·
     kata laluan ditukar / akaun disekat (pelayan, serta-merta) · tekan Sign out.
     Payslip dikunci semula dengan PIN selepas 10 minit di luar app.
     Telefon dikongsi (pilihan pada skrin log masuk): keluar / minimize app = log keluar (seperti dahulu);
     aliran luaran yang dibuka OLEH APP sendiri (kamera, pilih fail, kongsi, pautan) diberi masa untuk kembali. */
  var GRACE_MS = 3000, EXT_MS = 180000, RELOAD_MS = 15000, IDLE_MS = 30 * 864e5, SLIP_LOCK_MS = 600000;
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* abaikan */ } }
  function extFlow(ms) { S.extAt = Date.now(); S.extUntil = S.extAt + (ms || EXT_MS); }
  function sharedPhone() { return LS.get('nara_shared') === '1'; }
  function markSeen() { if (S.token) LS.set('nara_seen', String(Date.now())); }
  function idleTooLong() { var t = Number(LS.get('nara_seen') || 0); return !!t && Date.now() - t > IDLE_MS; }
  function leftApp() { if (S.token) { LS.set('nara_left', String(Date.now())); markSeen(); } }
  function backToApp() {
    var t = Number(LS.get('nara_left') || 0); LS.del('nara_left');
    var ext = S.extUntil || 0, at = S.extAt || 0; S.extUntil = S.extAt = 0;
    if (!S.token || !t) return;
    if (!sharedPhone()) {
      if (idleTooLong()) { securityLogout(); return; }
      if (Date.now() - t > SLIP_LOCK_MS && !window.NARA_PIN_LOGIN) { // privasi: payslip perlu PIN semula
        swrPut({ a: 'myPayslips', mem: true }, 'LOCKED'); delete FRESH[swrKey('myPayslips')];
        if (S.tab === 'lagi' && $('modal').hidden) loadLagi();
      }
      markSeen(); return;
    }
    // Telefon dikongsi: aliran luaran sah hanya jika app keluar dalam 15 s selepas app sendiri membukanya
    var ok = ext && t >= at - 1000 && t - at <= 15000 ? Date.now() <= ext : Date.now() - t <= GRACE_MS;
    if (!ok) securityLogout();
  }
  function securityLogout(msg) {
    if (!S.token) return;
    call('logout').catch(function () { /* token tamat di pelayan */ });
    camStop(); $('modal').hidden = true; $('modal-body').innerHTML = ''; S.gate = false;
    swrClear(); S.prefetched = false; S.wkHtml = S.statHtml = S.wkData = null; S.wkSel = null; S.dashHtml = null; S.hra = null; S.branch = null; S.urus = null; S.date = null; S.rp = null; S.tk = null; S.cv = null; S.cvCache = {}; S.cvPf = {};
    S.token = null; S.me = null; S.data = {}; S.onbShown = false; S.greetShown = false;
    LS.del('nara_token'); LS.del('nara_me'); LS.del('nara_left');
    try { var del = []; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('nara_c_') === 0) del.push(k); } del.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) { /* abaikan */ }
    renderLogin(msg);
    var pw = document.querySelector('[data-form=loginEmail] [name=password]');
    if (pw && LS.get('nara_email') && !(pkOk() && pkOnHere())) setTimeout(function () { try { pw.focus({ preventScroll: true }); } catch (e) { /* abaikan */ } }, 60);
  }

  /** Tahan untuk clock: cincin penuh → lepaskan → kamera dibuka (dalam acara pointerup, jadi pelayar membenarkan). */
  function bindDial() {
    var btn = document.querySelector('.dial[data-act=clock]');
    var ring = $('dial-ring');
    if (!btn || btn.disabled) return;
    var raf = null, t0 = 0, full = false, holding = false;
    var setP = function (p) { ring.style.setProperty('--p', p); };
    var reset = function () { cancelAnimationFrame(raf); holding = false; full = false; btn.classList.remove('hold', 'full'); setP(0); var s = $('dial-sub'); if (s) s.textContent = 'Hold until the ring fills'; };
    var step = function () {
      var p = Math.min(100, (Date.now() - t0) / 8);
      setP(p);
      if (p >= 100 && !full) {
        full = true; btn.classList.add('full');
        var s = $('dial-sub'); if (s) s.textContent = 'Release for selfie';
        buzz(25);
      }
      if (!full) raf = requestAnimationFrame(step);
    };
    btn.addEventListener('pointerdown', function (e) {
      if (btn.disabled) return;
      e.preventDefault();
      if (S.me && S.me.cb === 1 && !S.me.cbSkip) { cbOpen('gate'); return; } // staf baharu: faedah dahulu, sebelum clock-in pertama
      holding = true; full = false; t0 = Date.now();
      btn.classList.add('hold');
      try { btn.setPointerCapture(e.pointerId); } catch (x) { /* abaikan */ }
      raf = requestAnimationFrame(step);
    });
    btn.addEventListener('pointerup', function () {
      if (!holding) return;
      var wasFull = full;
      cancelAnimationFrame(raf);
      holding = false;
      if (wasFull) { S.dialFired = Date.now(); reset(); startClock(); }
      else { reset(); toast('Hold until the ring fills, then release.'); }
    });
    btn.addEventListener('pointercancel', reset);
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (S.me && S.me.cb === 1 && !S.me.cbSkip) { cbOpen('gate'); return; } S.dialFired = Date.now(); startClock(); }
    });
  }

  /* Clock pantas: kad dikemas kini serta-merta dengan masa tekan; hantaran ke pelayan di latar melalui peti keluar
     telefon (tiada internet / app ditutup → dihantar semula bila app dibuka; cid elak rekod berganda). */
  var STEP_LBL = { masuk: 'Clock in', keluar: 'Clock out', masuk2: 'Clock in (2)', keluar2: 'Clock out (2)', selesai: 'Shift done' };
  function clockNext(r, kat) { if (!r.masuk) return 'masuk'; if (!r.keluar) return 'keluar'; if (kat === 'Split' && !r.masuk2) return 'masuk2'; if (r.masuk2 && !r.keluar2) return 'keluar2'; return 'selesai'; }
  function clockQ() { try { return JSON.parse(LS.get('nara_clockq') || '[]'); } catch (e) { return []; } }
  function clockQSet(q) { try { if (q.length) LS.set('nara_clockq', JSON.stringify(q)); else LS.del('nara_clockq'); } catch (e) { /* storan penuh */ } }
  function clockQDel(cid) { clockQSet(clockQ().filter(function (x) { return x.p.cid !== cid; })); }
  function hm(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function clockOptimistic(step, at) {
    var d = S.data.today; if (!d) return;
    var r = {}; Object.keys(d.rekod || {}).forEach(function (k) { r[k] = d.rekod[k]; });
    r[step] = hm(at);
    d.rekod = r; d.langkah = clockNext(r, (d.syif || {}).kategori); d.langkahLabel = STEP_LBL[d.langkah];
    S.data.today = d; renderToday(d);

  function clockApply(res) {
    var d = S.data.today || {};
    if (res && res.ringkas) {
      var r = {}; Object.keys(d.rekod || {}).forEach(function (k) { r[k] = d.rekod[k]; });
      Object.keys(res.rekod || {}).forEach(function (k) { if (res.rekod[k] !== '' || !r[k]) r[k] = res.rekod[k]; });
      d.rekod = r; d.langkah = res.langkah; d.langkahLabel = res.langkahLabel;
    } else if (res) d = res;
    S.data.today = d; cacheSet('today', d);

  }
  function clockRefresh() {

    call('today').then(function (t) {

  function stRing(v, need, tone) {
    var p = Math.max(0, Math.min(1, v / Math.max(need, 0.1))), c = 2 * Math.PI * 30;

  }
  function stLabel(tone) { return tone === 'red' ? 'Short' : tone === 'orange' ? 'Over' : 'Balanced'; }
  /* Cadangan pelayan (BM, turut dibaca FIRAX dalam sheet) → senarai langkah dalam bahasa app */

    var W = { 'Tengah hari': 'midday', 'Petang': 'afternoon', 'Malam': 'night' };

      var r;
      if ((r = /^Alih ~([\d.]+) staf dari (.+) ke (.+)$/.exec(m))) return { k: 'move', t: 'Move ~' + r[1] + ' staff from ' + w(r[2]) + ' to ' + w(r[3]) };
      if ((r = /^Tambah ([\d.]+) staf pada (.+?) \((.*)\)$/.exec(m))) return { k: 'add', t: 'Add ' + r[1] + ' staff at ' + w(r[2]), s: r[3].replace(/^sambilan syif/, 'part-timer, shift').replace(/^syif split/, 'split shift').replace(/^syif/, 'shift').replace(/ atau /g, ' or ') };

      ['PERKESO + SIP', rm(j.perkesoPekerja + j.perkesoMajikan + j.sipPekerja + j.sipMajikan), 'majikan ' + rm(j.perkesoMajikan + j.sipMajikan)],
      ['PCB', rm(j.pcb), 'zakat ' + rm(j.zakat)], ['Employer cost', rm(j.kos), 'incl. HRD levy ' + rm(j.hrd)], ['Amaran', j.amaran, 'staff need review']
    ].map(function (x) { return '<div class="tile"><span class="eyebrow">' + h(x[0]) + '</span><b style="font-size:20px">' + h(x[1]) + '</b><span class="muted">' + h(x[2]) + '</span></div>'; }).join('');

    else if (d.status === 'Disahkan') act = '<button class="btn small" data-act="payFiles">Generate payslips & submission files</button><button class="btn green small" data-act="payPaid">Mark paid</button><button class="btn ghost small" data-act="payReopen">Reopen</button>';
    else act = '<button class="btn ghost small" data-act="payFiles">Regenerate slips & files</button>';
    var notes = [];
    if (d.missing && d.missing.length) notes.push('Not in Staff Salary (not processed): ' + d.missing.join(', '));
    if (d.draf && d.draf.length) notes.push('Earlier months still Draft (PCB YTD incomplete): ' + d.draf.join(', '));

  /** Muat turun fail: Blob + objectURL (data: URL + download tidak dipercayai di Safari iOS / Chrome). */
  function downloadB64(name, b64, mime) {
    extFlow();
    if (NATIVE && PLUG.Filesystem && PLUG.Share) {
      var fn = String(name || 'file').replace(/[^\w.\- ]+/g, '_');
      PLUG.Filesystem.writeFile({ path: fn, data: b64, directory: 'CACHE' })
        .then(function (r) { return PLUG.Share.share({ title: fn, url: r.uri, dialogTitle: 'Save or open ' + fn }); })
        .catch(function (e) { if (!/cancel/i.test(String(e && e.message))) toast('Couldn’t open the file. Try again.', true); });
      return;
    }
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 60000);
  }

  /* Kandungan halaman awam dipaparkan terus dalam popup (bukan iframe): tajuk & Close kekal statik, hanya teks yang skrol. */
  var DOC_CACHE = {};
  function docSheet(url, title) {
    modal(title, '<div class="doc-tools" id="doc-tools"></div><div class="doc-body" id="doc-body"><div class="doc-ph"><span class="spinner"></span></div></div>' +
      '<div class="doc-foot"><button class="btn ghost block" data-act="closeModal">Close</button></div>', 'doc-sheet');
    var got = DOC_CACHE[url] ? Promise.resolve(DOC_CACHE[url]) : fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); });
    got.then(function (html) {
      DOC_CACHE[url] = html;
      var body = $('doc-body'), tools = $('doc-tools');
      if (!body || $('modal').hidden) return;
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var main = doc.querySelector('main') || doc.body;
      Array.prototype.forEach.call(main.querySelectorAll('script,style,link,iframe,object,embed,form'), function (n) { n.remove(); });
      Array.prototype.forEach.call(main.querySelectorAll('*'), function (n) {
        Array.prototype.slice.call(n.attributes).forEach(function (a) { if (/^on/i.test(a.name) || (/^(href|src)$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name); });
        if (n.tagName === 'A' && /^https?:/i.test(n.getAttribute('href') || '')) { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener'); }
      });
      body.innerHTML = '<div class="doc-content">' + main.innerHTML + '</div>';
      // Jadual → kad bertingkat di telefon (tiada tatal ke tepi): setiap sel diberi label lajurnya
      Array.prototype.forEach.call(body.querySelectorAll('.doc-content table'), function (t) {
        var hs = []; t.classList.add('doc-tbl');
        Array.prototype.forEach.call(t.querySelectorAll('tr'), function (tr) {
          var cells = Array.prototype.slice.call(tr.children);
          if (cells.length && cells.every(function (c) { return c.tagName === 'TH'; })) { hs = cells.map(function (c) { return c.textContent.trim(); }); tr.classList.add('doc-th'); return; }
          cells.forEach(function (td, i) { if (hs[i]) td.setAttribute('data-l', hs[i]); });
        });
      });
      var upd = /Last updated ([^<·]+)/.exec(html);
      var two = body.querySelector('#en') && body.querySelector('#ms');
      tools.innerHTML = (two ? '<div class="seg mini" role="group" aria-label="Language"><button data-act="docLang" data-v="ms">Bahasa Melayu</button><button data-act="docLang" data-v="en">English</button></div>' : '') +
        (upd ? '<span class="doc-upd">Updated ' + h(upd[1].trim().replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\b/, '$1')) + '</span>' : '');
      if (two) docLang(LS.get('nara_doclang') || 'ms');
    }).catch(function () {
      var body = $('doc-body');
      if (body) body.innerHTML = '<iframe class="doc-if" src="' + h(url) + '" title="' + h(title) + '"></iframe>';
    });
  }

    Array.prototype.forEach.call(document.querySelectorAll('#doc-tools [data-act=docLang]'), function (x) { x.setAttribute('aria-pressed', String(x.dataset.v === v)); });

  var RT_L = ['', 'Trainee', 'Basic', 'Competent', 'Senior', 'Expert'];

  FORMS.ratingSave = function (f, btn) {

    [].forEach.call(f.querySelectorAll('input[type=radio]:checked'), function (el) { if (el.name.indexOf('sk_') === 0) p.sk[el.name.slice(3)] = Number(el.value); });

  /* ---- Kesediaan roster (salinan rateReady_ pelayan, dikira langsung semasa pengurus mengubah syif) ---- */
  /** Kesediaan dipaparkan bila sekurang-kurangnya separuh pasukan sudah dinilai HR (anggaran sahaja boleh mengelirukan). */
  function rpRateOn() { var g = S.rp && S.rp.plan && S.rp.plan.rating; return !!(g && g.n && g.dinilai * 2 >= g.n); }
  function rpReady(i) {
    var pl = S.rp && S.rp.plan; if (!pl || !pl.win || !pl.rating || !rpRateOn()) return null;
    var d = pl.days[i]; if (d.tutup) return null;
    var W = pl.win, RG = pl.rating, lbl = function (k) { var all = RG.stesen.BH.concat(RG.stesen.FH); for (var j = 0; j < all.length; j++) if (all[j][0] === k) return all[j][1]; return k; };
    var on = pl.staf.filter(function (x) { var c = S.rp.codes[x.id] && S.rp.codes[x.id][i]; return c && !away(x, i) && W[c] && W[c].some(Boolean) && x.rt; })
      .map(function (x) { return { nama: titleCase(String(x.nama).split(/\s+/)[0]), grp: x.grp, rt: x.rt, kod: S.rp.codes[x.id][i] }; });
    var got = 0, max = 0, isu = [], wins = [];
    RG.lbl.forEach(function (lb, w) {
      var duty = on.filter(function (x) { return W[x.kod][w]; });
      var o = { n: duty.length, pic: duty.some(function (x) { return x.rt.pic; }), avg: duty.length ? Math.round(duty.reduce(function (a, x) { return a + x.rt.t; }, 0) / duty.length * 10) / 10 : 0, isu: [] };
      if (!duty.length) { wins.push(o); return; }
      max += 3; if (o.pic) got += 3; else o.isu.push('no shift lead');
      ['FH', 'BH'].forEach(function (g) {
        var team = duty.filter(function (x) { return x.grp === g; }), gl = g === 'BH' ? 'Kitchen' : 'Front';
        if (!team.length) return;
        max += 2;
        var senior = team.some(function (x) { return x.rt.t >= 4; });
        if (senior) got += 2; else o.isu.push(gl + ': no senior');
        (RG.wajib[g] || []).forEach(function (k) {
          max += 1;
          if (team.some(function (x) { return (x.rt.sk[k] || 0) >= 2; })) got += 1; else o.isu.push(gl + ': no one for ' + lbl(k));
        });
        if (!senior) team.filter(function (x) { return x.rt.t <= 1; }).forEach(function (x) { got -= 1; o.isu.push(x.nama + ' (trainee) without a senior'); });
      });
      if (d.sibuk && o.avg && o.avg < 3) { max += 1; o.isu.push('busy day, team level ' + o.avg + ' (aim 3+)'); } else if (d.sibuk) { max += 1; got += 1; }
      o.isu.forEach(function (t) { isu.push({ w: lb, t: t }); });
      wins.push(o);
    });
    return { skor: max ? Math.max(0, Math.round(got / max * 100)) : null, isu: isu, win: wins };
  }
  function rpReadyCard(i) {

  /* Tiada tanda sempang panjang (em dash / en dash) dalam teks yang dipaparkan, termasuk teks dari sheet

  var DASH_RE = /[\u2014\u2013]/, DASH_SKIP = /^(SCRIPT|STYLE|TEXTAREA|OPTION|INPUT)$/;
  function undash(t) {
    return t.replace(/\s+\u2014\s+/g, ', ').replace(/\s+\u2013\s+/g, ' - ').replace(/^\s*\u2014\s*/, '').replace(/[\u2014\u2013]/g, '-');
  }
  function undashText(n) {
    var v = n.nodeValue, p = n.parentNode;
    if (!v || !DASH_RE.test(v) || (p && DASH_SKIP.test(p.nodeName))) return;
    n.nodeValue = undash(v);
  }
  function undashTree(root) {
    if (!root) return;
    if (root.nodeType === 3) { undashText(root); return; }
    if (root.nodeType !== 1 || DASH_SKIP.test(root.nodeName)) return;
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n;
    while ((n = w.nextNode())) undashText(n);
  }
  try {
    new MutationObserver(function (ms) {
      ms.forEach(function (m) { if (m.type === 'characterData') undashText(m.target); else Array.prototype.forEach.call(m.addedNodes, undashTree); });
    }).observe(document.body, { childList: true, subtree: true, characterData: true });
    undashTree(document.body);
  } catch (e) { /* pelayar lama: teks sumber app sudah tanpa sempang panjang */ }

  document.addEventListener('submit', function (e) {
    var f = e.target;
    var fn = FORMS[f.dataset.form];
    if (!fn) return;
    e.preventDefault();
    var btn = f.querySelector('[type=submit]');
    busy(btn, true);
    fn(f, btn);
  });

  /* ======================= Mula ======================= */
  function boot() {
    if (!FRAME_OK) {
      $('app').innerHTML = '<div class="login"><div class="card"><div class="row"><div class="logo nara">' + MARK + '</div><div><h1>NARA HR</h1><div class="muted">Sofwah Arabic Grill</div></div></div>' +
        '<p>For security, NARA HR opens only through the official link.</p><a class="btn block" href="https://nara.sofwah.my/hr/" target="_top" rel="noopener">Open nara.sofwah.my/hr</a></div></div>';
      return;
    }
    var jk = joinKeyFromHash(); // QR "Join the Sofwah team": borang staf baharu (tanpa log masuk)
    if (jk) { renderJoin(jk); return; }
    if (navigator.onLine === false) setOffline(true);
    var tok = LS.get('nara_token');
    // Sesi pintar: telefon sendiri kekal log masuk bila app dibuka semula (kecuali tidak digunakan 30 hari);
    // telefon dikongsi: setiap kali app dibuka semula (bukan muat semula dalam sesi yang sama) → log masuk semula
    var left = Number(LS.get('nara_left') || 0);
    var same = ssGet('nara_alive') === '1' && (!left || Date.now() - left <= RELOAD_MS);
    if (tok && !S.migrated && (sharedPhone() ? !same : idleTooLong())) {
      S.token = tok;
      securityLogout();
      return;
    }
    LS.del('nara_left');
    if (!tok) { renderLogin(); warmServer(); return; }
    S.token = tok; ssSet('nara_alive', '1'); markSeen();
    // Buka serta-merta daripada profil tersimpan; sahkan dengan pelayan di latar.
    var cachedMe = null;
    try { cachedMe = JSON.parse(LS.get('nara_me') || 'null'); } catch (e) { cachedMe = null; }
    if (cachedMe && cachedMe.privasi && !cachedMe.tukarPin) { S.me = cachedMe; renderShell(); }
    call('me').then(function (me) {
      var changed = !S.me || S.me.role !== me.role || S.me.cawangan !== me.cawangan || S.me.privasi !== me.privasi || S.me.tukarPin !== me.tukarPin || String(S.me.scope) !== String(me.scope);
      S.me = me; LS.set('nara_me', JSON.stringify(me));
      if (changed) renderShell();
    }).catch(function (e) {
      if (e && (e.transport || e.busy) && S.me) { setOffline(true); return; } // tiada internet: kekal dengan data tersimpan
      LS.del('nara_token'); LS.del('nara_me'); S.token = null; S.me = null; renderLogin(); warmServer();
    });
  }
  /** Skrin log masuk dibuka: minta pelayan sediakan cache sementara staf menaip kata laluan (log masuk jadi pantas). */
  function warmServer() {
    if (S.warmAt && Date.now() - S.warmAt < 120000) return;
    S.warmAt = Date.now();
    var pk = !S.token && pkOk();
    rawCall('ping', pk ? { pk: 1 } : {}, 15000).then(function (d) { if (pk && d && d.pk) pkSetLogin(d.pk); }).catch(function () { /* pilihan */ });
  }
  if (NATIVE) {
    document.documentElement.classList.add('native');
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (/^https?:\/\//i.test(href) && (a.target === '_blank' || new URL(href).origin !== location.origin)) { e.preventDefault(); openExternal(href); }
    }, true);
    if (PLUG.App) PLUG.App.addListener('backButton', function () {
      if (!$('modal').hidden) { closeModal(); return; }
      if (S.urus) { S.urus = null; S.dirty = false; loadUrus(); return; }
      if (S.token && S.tab && S.tab !== 'hari') { S.tab = 'hari'; S.urus = null; renderShell(); return; }
      PLUG.App.minimizeApp();
    });
    if (PLUG.SplashScreen) setTimeout(function () { PLUG.SplashScreen.hide().catch(function () {}); }, 150);
  }
  boot();
})();
</script>

  var hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadCtl && Date.now() - window.__t0 < 8000 && !window.__reloaded) { window.__reloaded = true; location.reload(); }
  });
}
if (location.protocol === 'http:' && /(^|\.)sofwah\.my$/.test(location.hostname)) location.replace('https://' + location.host + location.pathname + location.search);
